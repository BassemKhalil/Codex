name: Build APK

on:
  push:
  workflow_dispatch:

# Needed so the workflow can publish the built APK to a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage a nicely named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LebaneseCarImportTax.apk

      # Fallback download: the Actions "Artifacts" zip.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LebaneseCarImportTax-apk
          path: LebaneseCarImportTax.apk

      # Primary phone-only path: a direct, tappable .apk link on the Releases page.
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Lebanese Car Import Tax — latest APK
          body: |
            Tap **LebaneseCarImportTax.apk** below on your phone to install it.

            First time only: when your phone warns about installing from an
            unknown source, allow your browser / file manager to install apps,
            then tap the APK again.

            Built automatically from commit ${{ github.sha }}.
          files: LebaneseCarImportTax.apk
